name: Docs build and deploy
run-name: Docs build and deploy

on:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Applies to every npm invocation in this workflow, including the one
  # cloudflare/wrangler-action runs itself to install wrangler -- which is why this is an env var
  # and not a flag on our own install step. See the install step for why the conflict exists.
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  deploy:
    name: Build and deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 9.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build DocSamples
        run: dotnet build src/DocSamples/DocSamples.csproj -c Release

      - name: Install mdsnippets
        run: dotnet tool install -g MarkdownSnippets.Tool

      - name: Run mdsnippets
        run: mdsnippets

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Needs NPM_CONFIG_LEGACY_PEER_DEPS, set at the top of this workflow.
      # vitepress-plugin-mermaid 2.0.17 -- the latest there is -- declares
      # `peer mermaid@"10 || 11"`, and weasel#713 took mermaid to 12.2.0 as the ancestor dependency
      # of a katex bump. npm 10 refuses that combination outright, so plain `npm ci` has failed
      # since 2026-10-15 and no docs deploy has run since; nothing caught it because this workflow
      # is workflow_dispatch only and no PR check builds the site.
      #
      # Not fixed by pinning mermaid back to 11: the bump is what closed mermaid's own advisories
      # (an infinite-loop DoS in XY charts, CSS injection, prototype pollution) and katex's, so a
      # downgrade would reopen them to keep a peer range happy. The pairing is verified rather than
      # assumed -- built locally on mermaid 12.2.0 and loaded in a browser, where a diagram renders
      # as a 36-node SVG with no console errors. Revisit if the plugin ever ships a release that
      # peers on 12.
      - name: Install npm dependencies
        run: npm ci

      - name: Build VitePress site
        run: npx vitepress build docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy docs/.vitepress/dist --project-name=jasperfx-weasel --branch=master
