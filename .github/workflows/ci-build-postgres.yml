name: Postgres CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A re-pushed pull request branch supersedes its predecessor, so cancel the older run instead of
# letting it hold a slot (weasel#611). JasperFx is on the Free org plan, where the concurrent-job
# ceiling is shared across every repo, so a superseded weasel run is a slot marten, wolverine or
# fisher does not get -- and one commit here is 22 jobs across the eight workflows.
#
# Two deliberate choices, neither of them boilerplate:
#   - cancel-in-progress is conditional rather than true. On a pull request the older run really is
#     superseded. On a push to master it is not: each commit's result is the record for that commit
#     and a release is cut from one, so cancelling an in-flight master run destroys the only
#     evidence the commit was green.
#   - github.workflow is part of the group key. Grouping by branch alone would make the eight
#     workflows cancel EACH OTHER on the same branch, which is the opposite of the point -- they
#     are eight different test matrices, not eight attempts at one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: read lets the ledger step download the previous run's artifact.
permissions:
  actions: read
  contents: read

env:
  config: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  db_name: weasel_testing
  db_user: test_user
  db_pwd: P@55w0rd

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
    # define the test matrix
        matrix:
            postgres-image:
                - postgres:15.3-alpine
            useCaseSensitiveQualifiedNames:
                - true
                - false
            framework:
                - net9.0
                - net10.0

    name: Postgres ${{ matrix.postgres-image }} ${{ matrix.framework }} Case Sensitive ${{ matrix.useCaseSensitiveQualifiedNames }}

    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ${{ env.db_name }}
          POSTGRES_USER: ${{ env.db_user }}
          USE_CASE_SENSITIVE_QUALIFIED_NAMES:  ${{ matrix.useCaseSensitiveQualifiedNames }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Optimize Postgres database for running tests faster
      run: |
        PG_CONTAINER_NAME=$(docker ps --filter expose=5432/tcp --format {{.Names}})
        docker exec $PG_CONTAINER_NAME bash -c "echo -e '\nfsync = off' >> /var/lib/postgresql/data/postgresql.conf"
        docker container restart $PG_CONTAINER_NAME
      shell: bash

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: |
              9.0.x
              10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    # The ledger the supervisor balances lanes with, from the newest successful master run of this
    # workflow (bobcat#730: the ledger travels as a CI artifact, nothing is committed). Missing is
    # fine: the first run, or a new matrix leg, balances by test count.
    - name: Download the previous test ledger
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --branch master \
          --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
        if [ -n "$run_id" ]; then
          gh run download "$run_id" --repo "${{ github.repository }}" --name "test-ledger-postgres-${{ matrix.framework }}-cs${{ matrix.useCaseSensitiveQualifiedNames }}" --dir artifacts/test-ledger \
            || echo "No test-ledger-postgres-${{ matrix.framework }}-cs${{ matrix.useCaseSensitiveQualifiedNames }} artifact on run $run_id: lanes balance by test count"
        fi
        # Only the ledger carries over; a stale report must not pass for this run's.
        rm -f artifacts/test-ledger/*.report.json

    - name: Test
      env:
        CI_JOB_NAME: postgres-${{ matrix.framework }}-cs${{ matrix.useCaseSensitiveQualifiedNames }}
        weasel_postgresql_testing_database: "Host=localhost;Database=${{ env.db_name }};Username=${{ env.db_user }};Password=${{ env.db_pwd }};"
      run: ./build.sh TestPostgresql --framework ${{ matrix.framework }} --configuration Debug

    # The ledger (carried forward with this run folded in) and the supervisor's JSON report, per leg.
    # The next run's "Download the previous test ledger" step picks the ledger up from master.
    - name: Upload test ledger
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-ledger-postgres-${{ matrix.framework }}-cs${{ matrix.useCaseSensitiveQualifiedNames }}
        path: artifacts/test-ledger/
        if-no-files-found: ignore

