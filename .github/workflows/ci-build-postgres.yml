name: Postgres CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A re-pushed pull request branch supersedes its predecessor, so cancel the older run instead of
# letting it hold a slot (weasel#611). JasperFx is on the Free org plan, where the concurrent-job
# ceiling is shared across every repo, so a superseded weasel run is a slot marten, wolverine or
# fisher does not get -- and one commit here is 22 jobs across the eight workflows.
#
# Two deliberate choices, neither of them boilerplate:
#   - cancel-in-progress is conditional rather than true. On a pull request the older run really is
#     superseded. On a push to master it is not: each commit's result is the record for that commit
#     and a release is cut from one, so cancelling an in-flight master run destroys the only
#     evidence the commit was green.
#   - github.workflow is part of the group key. Grouping by branch alone would make the eight
#     workflows cancel EACH OTHER on the same branch, which is the opposite of the point -- they
#     are eight different test matrices, not eight attempts at one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: read lets the ledger step download the previous run's artifact.
permissions:
  actions: read
  contents: read

env:
  config: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  db_name: weasel_testing
  db_user: test_user
  db_pwd: P@55w0rd

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # weasel#720: this matrix used to carry a useCaseSensitiveQualifiedNames dimension, doubling the
    # workflow to four jobs. It tested nothing, in two independent ways. The variable it set was set
    # on the POSTGRES SERVICE CONTAINER, so the test process never saw it and both legs ran
    # identically. And the property it would have set --
    # PostgresqlProvider.UseCaseSensitiveQualifiedNames -- is [Obsolete] and read by no product code:
    # identifiers are unconditionally quoted when they are keywords or carry uppercase. So the leg
    # could not be repaired by moving the variable, only deleted. The mixed-case coverage it was
    # meant to provide now runs in every leg (SequenceTester).
    strategy:
    # define the test matrix
        matrix:
            postgres-image:
                - postgres:15.3-alpine
            framework:
                - net9.0
                - net10.0

    name: Postgres ${{ matrix.postgres-image }} ${{ matrix.framework }}

    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ${{ env.db_name }}
          POSTGRES_USER: ${{ env.db_user }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Optimize Postgres database for running tests faster
      run: |
        PG_CONTAINER_NAME=$(docker ps --filter expose=5432/tcp --format {{.Names}})
        docker exec $PG_CONTAINER_NAME bash -c "echo -e '\nfsync = off' >> /var/lib/postgresql/data/postgresql.conf"
        docker container restart $PG_CONTAINER_NAME
      shell: bash

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: |
              9.0.x
              10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    # The ledger the supervisor balances lanes with, from the newest successful master run of this
    # workflow (bobcat#730: the ledger travels as a CI artifact, nothing is committed). Missing is
    # fine: the first run, or a new matrix leg, balances by test count.
    - name: Download the previous test ledger
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" --branch master \
          --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
        if [ -n "$run_id" ]; then
          gh run download "$run_id" --repo "${{ github.repository }}" --name "test-ledger-postgres-${{ matrix.framework }}" --dir artifacts/test-ledger \
            || echo "No test-ledger-postgres-${{ matrix.framework }} artifact on run $run_id: lanes balance by test count"
        fi
        # Only the ledger carries over; a stale report must not pass for this run's.
        rm -f artifacts/test-ledger/*.report.json

    - name: Test
      env:
        CI_JOB_NAME: postgres-${{ matrix.framework }}
        weasel_postgresql_testing_database: "Host=localhost;Database=${{ env.db_name }};Username=${{ env.db_user }};Password=${{ env.db_pwd }};"
      run: ./build.sh TestPostgresql --framework ${{ matrix.framework }} --configuration Debug

    # weasel#721. Weasel.CommandLine.Tests was run by no workflow, so its 57 tests could rot unseen.
    # It belongs to this workflow and not the Core one despite its name: it compiles in
    # Weasel.Postgresql.Tests' own ConnectionSource and drops real schemas on the server, so it needs
    # this job's Postgres service. A separate step rather than a line in the one above, so a failure
    # names which suite failed, and so each suite keeps its own ledger and report (both are keyed by
    # project name as well as job).
    #
    # if: always() deliberately: a red Postgres suite must not hide whether this one is red too.
    - name: Test the command line
      if: always()
      env:
        CI_JOB_NAME: postgres-${{ matrix.framework }}-cs${{ matrix.useCaseSensitiveQualifiedNames }}
        weasel_postgresql_testing_database: "Host=localhost;Database=${{ env.db_name }};Username=${{ env.db_user }};Password=${{ env.db_pwd }};"
      run: ./build.sh TestCommandLine --framework ${{ matrix.framework }} --configuration Debug

    # The ledger (carried forward with this run folded in) and the supervisor's JSON report, per leg.
    # The next run's "Download the previous test ledger" step picks the ledger up from master.
    - name: Upload test ledger
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-ledger-postgres-${{ matrix.framework }}
        path: artifacts/test-ledger/
        if-no-files-found: ignore

