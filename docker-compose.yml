# Host ports are env-driven so the stack can run beside another repository's containers on a shared
# machine (Marten's Postgres on 5432, Wolverine's MySQL and Oracle on 3306 and 1521). The defaults are
# the ports the test suites' own connection-string defaults expect; move one with WEASEL_*_PORT and point
# the matching weasel_*_testing_database variable at it. See "Local gate" in CLAUDE.md.
services:
  postgresql:
    image: "postgres:15.3-alpine"
    # The local gate runs the Postgres suite on 4 lanes, which peak at about 90 client connections:
    # too close to the stock 100. On a server left at 100 the gate drops to 3 lanes (build/LocalGate.cs).
    command: ["postgres", "-c", "max_connections=200"]
    ports:
     - "${WEASEL_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      # Not marten_testing: the per-lane databases are named <database>_w{n}, and Marten's lanes on a
      # shared server are marten_testing_w{n} (weasel#733).
      POSTGRES_DB: weasel_testing
      NAMEDATALEN: 100
  sqlserver:
      image: "mcr.microsoft.com/azure-sql-edge"
      ports:
          - "${WEASEL_SQLSERVER_PORT:-1435}:1433"
      environment:
          - "ACCEPT_EULA=Y"
          - "SA_PASSWORD=P@55w0rd"
          - "MSSQL_PID=Developer"
  oracle:
      image: "gvenzl/oracle-free:23-slim"
      ports:
          - "${WEASEL_ORACLE_PORT:-1521}:1521"
      environment:
          - "ORACLE_PASSWORD=P@55w0rd"
          - "APP_USER=weasel"
          - "APP_USER_PASSWORD=P@55w0rd"
      volumes:
          - ./docker/oracle:/container-entrypoint-initdb.d
  mysql:
      image: "mysql:8.0"
      ports:
          - "${WEASEL_MYSQL_PORT:-3306}:3306"
      environment:
          - "MYSQL_ROOT_PASSWORD=P@55w0rd"
          - "MYSQL_DATABASE=weasel_testing"
          - "MYSQL_USER=weasel"
          - "MYSQL_PASSWORD=P@55w0rd"

  # One service per supported Firebird major. The official images run as SYSDBA with the root
  # password below, allow a database at any path, and create none on their own: the tests create
  # a database file per class under /var/lib/firebird/data. The healthcheck talks to the service
  # manager, which needs no database, with the credentials fbsvcmgr reads from ISC_USER and
  # ISC_PASSWORD, as the CI workflows do. The first connection right after start fails for about
  # half a second -- so gate on health, not on the port.
  firebird3:
      image: "firebirdsql/firebird:3"
      ports:
          - "${WEASEL_FIREBIRD3_PORT:-3063}:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30
  firebird4:
      image: "firebirdsql/firebird:4"
      ports:
          - "${WEASEL_FIREBIRD4_PORT:-3064}:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30
  firebird5:
      image: "firebirdsql/firebird:5"
      ports:
          - "${WEASEL_FIREBIRD5_PORT:-3065}:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30

  # The CI SQL Server legs (ci-build-mssql.yml runs 2019 and 2022), for the local gate's optional
  # legs (`./build.sh LocalGate --gate-legs sqlserver2019,sqlserver2022`). Behind a profile, so a plain
  # `docker compose up` does not start them: `docker compose --profile legs up -d sqlserver2019`.
  # Both images are amd64 only; on Apple silicon they run under Rosetta, and 2019 may not start there.
  sqlserver2019:
      image: "mcr.microsoft.com/mssql/server:2019-latest"
      profiles: ["legs"]
      ports:
          - "${WEASEL_SQLSERVER2019_PORT:-1436}:1433"
      environment:
          - "ACCEPT_EULA=Y"
          - "SA_PASSWORD=P@55w0rd"
  sqlserver2022:
      image: "mcr.microsoft.com/mssql/server:2022-latest"
      profiles: ["legs"]
      ports:
          - "${WEASEL_SQLSERVER2022_PORT:-1437}:1433"
      environment:
          - "ACCEPT_EULA=Y"
          - "SA_PASSWORD=P@55w0rd"
