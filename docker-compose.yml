version: '3'
services:
  postgresql:
    image: "postgres:15.3-alpine"
    ports:
     - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: marten_testing
      NAMEDATALEN: 100
  sqlserver:
      image: "mcr.microsoft.com/azure-sql-edge"
      ports:
          - "1435:1433"
      environment:
          - "ACCEPT_EULA=Y"
          - "SA_PASSWORD=P@55w0rd"
          - "MSSQL_PID=Developer"
  oracle:
      image: "gvenzl/oracle-free:23-slim"
      ports:
          - "1521:1521"
      environment:
          - "ORACLE_PASSWORD=P@55w0rd"
          - "APP_USER=weasel"
          - "APP_USER_PASSWORD=P@55w0rd"
      volumes:
          - ./docker/oracle:/container-entrypoint-initdb.d
  mysql:
      image: "mysql:8.0"
      ports:
          - "3306:3306"
      environment:
          - "MYSQL_ROOT_PASSWORD=P@55w0rd"
          - "MYSQL_DATABASE=weasel_testing"
          - "MYSQL_USER=weasel"
          - "MYSQL_PASSWORD=P@55w0rd"

  # One service per supported Firebird major. The official images run as SYSDBA with the root
  # password below, allow a database at any path, and create none on their own: the tests create
  # a database file per class under /var/lib/firebird/data. The healthcheck talks to the service
  # manager, which needs no database, with the credentials fbsvcmgr reads from ISC_USER and
  # ISC_PASSWORD, as the CI workflows do. The first connection right after start fails for about
  # half a second -- so gate on health, not on the port.
  firebird3:
      image: "firebirdsql/firebird:3"
      ports:
          - "3063:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30
  firebird4:
      image: "firebirdsql/firebird:4"
      ports:
          - "3064:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30
  firebird5:
      image: "firebirdsql/firebird:5"
      ports:
          - "3065:3050"
      environment:
          - "FIREBIRD_ROOT_PASSWORD=P@55w0rd"
          - "ISC_USER=SYSDBA"
          - "ISC_PASSWORD=P@55w0rd"
      healthcheck:
          test: ["CMD", "/opt/firebird/bin/fbsvcmgr", "localhost:service_mgr", "info_server_version"]
          interval: 2s
          timeout: 5s
          retries: 30
