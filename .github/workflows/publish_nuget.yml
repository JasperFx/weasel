name: Publish Nugets

on:
  workflow_dispatch:

# No concurrency group here, deliberately (weasel#611). This workflow is workflow_dispatch only,
# each dispatch publishes once, and a cancelled publish -- packages half pushed, the run gone -- is
# far worse than a duplicated queue slot. The eight ci-build-* workflows do have one.

# Trusted publishing (OIDC), rather than a long-lived NUGET_API_KEY secret. NuGet/login exchanges
# this run's GitHub OIDC token for an API key that expires in minutes, so there is no durable
# credential in the repository to leak or rotate. `id-token: write` is what lets the runner request
# that token; without it the login step fails with a missing-token error rather than publishing
# anything. `contents: read` is the checkout, declared explicitly because naming any permission
# drops the rest to none.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: |
              10.0.x
              11.0.x
          # .NET 11 is a release candidate until November
          dotnet-quality: preview

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack Weasel.Core
      run: dotnet pack ./src/Weasel.Core/Weasel.Core.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.Storage
      run: dotnet pack ./src/Weasel.Storage/Weasel.Storage.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.Postgresql
      run: dotnet pack ./src/Weasel.Postgresql/Weasel.Postgresql.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.SqlServer
      run: dotnet pack ./src/Weasel.SqlServer/Weasel.SqlServer.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.MySql
      run: dotnet pack ./src/Weasel.MySql/Weasel.MySql.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.Oracle
      run: dotnet pack ./src/Weasel.Oracle/Weasel.Oracle.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.Sqlite
      run: dotnet pack ./src/Weasel.Sqlite/Weasel.Sqlite.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.Firebird
      run: dotnet pack ./src/Weasel.Firebird/Weasel.Firebird.csproj -o ./artifacts --configuration Release --no-build

    - name: Pack Weasel.EntityFrameworkCore
      run: dotnet pack ./src/Weasel.EntityFrameworkCore/Weasel.EntityFrameworkCore.csproj -o ./artifacts --configuration Release --no-build

    # Exchanges this run's OIDC token for a short-lived NuGet API key. `user` is the NuGet.org
    # account that owns the trusted publishing policy -- it has to match, and a mismatch fails here,
    # before any package is pushed.
    - name: Log in to NuGet with trusted publishing
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: jeremydmiller

    - name: Publish to NuGet
      run: |
        find . -name '*.nupkg' -exec dotnet nuget push "{}" -s https://api.nuget.org/v3/index.json -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate \;
        # find . -name '*.snupkg' -exec dotnet nuget push "{}" -s https://api.nuget.org/v3/index.json -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \;
      shell: bash
