name: MySql CI build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A re-pushed pull request branch supersedes its predecessor, so cancel the older run instead of
# letting it hold a slot (weasel#611). JasperFx is on the Free org plan, where the concurrent-job
# ceiling is shared across every repo, so a superseded weasel run is a slot marten, wolverine or
# fisher does not get -- and one commit here is 18 jobs across the seven workflows.
#
# Two deliberate choices, neither of them boilerplate:
#   - cancel-in-progress is conditional rather than true. On a pull request the older run really is
#     superseded. On a push to master it is not: each commit's result is the record for that commit
#     and a release is cut from one, so cancelling an in-flight master run destroys the only
#     evidence the commit was green.
#   - github.workflow is part of the group key. Grouping by branch alone would make the seven
#     workflows cancel EACH OTHER on the same branch, which is the opposite of the point -- they
#     are seven different test matrices, not seven attempts at one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  config: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  db_pwd: P@55w0rd

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
        matrix:
            mysql-image:
                - mysql:8.0
            framework:
                - net9.0
                - net10.0

    name: MySql ${{ matrix.mysql-image }} ${{ matrix.framework }}

    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.db_pwd }}
          MYSQL_DATABASE: weasel_testing
          MYSQL_USER: weasel
          MYSQL_PASSWORD: ${{ env.db_pwd }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
            9.0.x
            10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      env:
        weasel_mysql_testing_database: "Server=localhost;Port=3306;Database=weasel_testing;Uid=weasel;Pwd=${{ env.db_pwd }};"
      run: dotnet test src/Weasel.MySql.Tests/Weasel.MySql.Tests.csproj --no-build --verbosity normal --framework ${{ matrix.framework }}
